# [DOC-D02] frontend/nginx.conf
# --------------------------------
# Configuração do servidor Nginx para servir o build Vue em produção.
#
# Responsabilidades:
# - Servir os arquivos estáticos gerados pelo `vite build` (/dist)
# - Redirecionar todas as rotas para index.html (SPA fallback)
# - Fazer proxy reverso de /api/ → backend FastAPI (porta 8000)
# - Configurar headers de segurança e cache para assets estáticos

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Charset UTF-8 para suporte ao português
    charset utf-8;

    # -----------------------------------------------------------------------
    # SPA Fallback — todas as rotas retornam index.html
    # Necessário para que o Vue Router funcione em produção
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # Proxy reverso — /api/* → backend FastAPI
    # Em produção, o frontend e o backend rodam em containers separados.
    # O Nginx faz a ponte entre eles na rede interna do Docker.
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check do backend via Nginx
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # -----------------------------------------------------------------------
    # Cache de longa duração para assets com hash no nome
    # (gerados pelo Vite: main.abc123.js, style.abc123.css)
    # -----------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Headers de segurança
    # -----------------------------------------------------------------------
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
}
